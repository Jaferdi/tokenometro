name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile tracker.py statusline.py demo.py start.py install.py
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh && bash -n start.sh
      - name: Dashboard script syntax
        run: |
          python - <<'PY'
          src = open("tracker.py", encoding="utf-8").read()
          page = src[src.index('PAGE = r"""'):]
          js = page[page.index("<script>", page.index("<body")) + 8:page.index("</script></body>")]
          open("page.js", "w", encoding="utf-8").write(js)
          PY
          node --check page.js
      - name: Installer in a throwaway HOME
        env:
          TOKENOMETRO_NO_START: "1"
          TOKENOMETRO_PORT: "7999"
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home" LOCALAPPDATA="$RUNNER_TEMP/home/AppData"
          mkdir -p "$HOME/.claude/projects"
          python install.py
          python -c "import json,os; s=json.load(open(os.path.expanduser('~/.claude/settings.json'))); assert 'tokenometro/start.py' in json.dumps(s)"
          python install.py --statusline
          python install.py --uninstall
          python -c "import json,os; s=json.load(open(os.path.expanduser('~/.claude/settings.json'))); assert 'tokenometro' not in json.dumps(s)"
          if [ "$RUNNER_OS" != "Windows" ]; then bash install.sh && bash "$HOME/.local/share/tokenometro/install.sh" --uninstall; fi

  prices:
    name: prices.json is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import json; json.load(open('prices.json'))"

  plugin:
    name: Plugin manifests are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json
          p = json.load(open(".claude-plugin/plugin.json"))
          m = json.load(open(".claude-plugin/marketplace.json"))
          h = json.load(open("hooks/hooks.json"))
          assert p["name"] == m["plugins"][0]["name"] == "tokenometro"
          assert "start.py" in h["hooks"]["SessionStart"][0]["hooks"][0]["command"]
          PY
